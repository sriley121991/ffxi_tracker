{% if character_list %}
    <ul>
    {% for character in character_list %}
        <li>
            <a href="{% url 'characters:character_details' character.character_name %}">{{ character.character_name }}</a>
            - <a href="{% url 'characters:update_character' character.character_name %}">[edit]</a>
        </li>
    {% endfor %}
    </ul>

    
{% endif %}
<a href="{% url 'characters:new_character' %}"><button>Create New Character</button></a>
